{
  "name": "Validate and deploy Doti Pages",
  "on": {
    "push": { "branches": ["main"] },
    "pull_request": {},
    "workflow_dispatch": {}
  },
  "permissions": { "contents": "read" },
  "jobs": {
    "validate": {
      "runs-on": "ubuntu-latest",
      "steps": [
        { "name": "Checkout", "uses": "actions/checkout@v6" },
        { "name": "Run contract tests", "run": "python3 -m unittest discover -s tests -v" },
        { "name": "Validate site", "run": "python3 scripts/validate_site.py site" }
      ]
    },
    "deploy": {
      "if": "github.ref == 'refs/heads/main' && github.event_name != 'pull_request'",
      "needs": "validate",
      "runs-on": "ubuntu-latest",
      "permissions": { "contents": "read", "pages": "write", "id-token": "write" },
      "environment": { "name": "github-pages", "url": "${{ steps.deployment.outputs.page_url }}" },
      "concurrency": { "group": "pages", "cancel-in-progress": false },
      "steps": [
        { "name": "Checkout", "uses": "actions/checkout@v6" },
        { "name": "Configure Pages", "uses": "actions/configure-pages@v5" },
        { "name": "Upload site only", "uses": "actions/upload-pages-artifact@v4", "with": { "path": "site" } },
        { "name": "Deploy", "id": "deployment", "uses": "actions/deploy-pages@v4" }
      ]
    }
  }
}
